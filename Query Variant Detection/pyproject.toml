[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "query-variant-detection"
version = "0.1.0"
description = "Reproducibility code for Query Variant Detection Using Retriever as Environment"
requires-python = ">=3.9"

[tool.setuptools]
packages = ["qvd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

