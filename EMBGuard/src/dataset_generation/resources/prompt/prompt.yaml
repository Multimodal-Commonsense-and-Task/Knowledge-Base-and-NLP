  {{
    "graph": [
      [counter,"in","kitchen"],
      ["gas burner","on","counter"],
      ["gas burner","lit","null"],
      ["cotton dish towel","on","counter edge"],
      ["cotton dish towel","right beside","gas burner"]
    ]
  }}

